<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chess Vision Trainer</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    color: #fff;
    padding: 15px;
    -webkit-tap-highlight-color: transparent;
}

.container {
    max-width: 500px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 5px;
    background: linear-gradient(90deg, #00d4ff, #7b2cbf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 15px;
    font-size: 0.9rem;
}

.stats-bar {
    display: flex;
    justify-content: space-around;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.stat-label {
    color: #888;
    font-size: 0.75rem;
}

.stat-value {
    font-size: 1.1rem;
    font-weight: bold;
    color: #00d4ff;
}

.board-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 15px;
}

.board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 3px solid #444;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    width: min(90vw, 400px);
    height: min(90vw, 400px);
    touch-action: manipulation;
}

.square {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(10vw, 44px);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color 0.15s ease;
    position: relative;
}

.square.light { background-color: #f0d9b5; }
.square.dark { background-color: #b58863; }
.square.selected { background-color: #7fc97f !important; box-shadow: inset 0 0 0 3px #2d6a2d; }
.square.hint { background-color: #ffeb3b !important; }
.square.found::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: rgba(0, 212, 255, 0.7);
    border-radius: 50%;
    pointer-events: none;
}

.square.correct-flash { animation: correctFlash 0.3s ease; }
.square.wrong-flash { animation: wrongFlash 0.3s ease; }

@keyframes correctFlash { 0% { background-color: #4caf50 !important; } }
@keyframes wrongFlash { 0% { background-color: #f44336 !important; } }

.white-piece { color: #fff; text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5); }
.black-piece { color: #000; }

.info-row {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.turn-indicator {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    font-size: 0.95rem;
}

.turn-indicator.white { background: linear-gradient(135deg, #f0d9b5, #dcc5a0); color: #333; }
.turn-indicator.black { background: linear-gradient(135deg, #444, #333); color: #fff; }

.selection-box {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1.1rem;
}

.square-display {
    background: rgba(255, 255, 255, 0.1);
    padding: 5px 12px;
    border-radius: 5px;
    font-weight: bold;
}

.arrow { color: #00d4ff; }

.found-moves {
    background: rgba(255, 255, 255, 0.05);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    min-height: 60px;
}

.found-moves h3 {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 8px;
}

.moves-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.move-tag {
    background: rgba(0, 212, 255, 0.2);
    color: #00d4ff;
    padding: 3px 7px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-family: monospace;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.btn {
    padding: 12px 20px;
    font-size: 0.95rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease;
    touch-action: manipulation;
}

.btn:disabled { opacity: 0.5; }
.btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; }
.btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; }
.btn-hint { background: linear-gradient(135deg, #ffeb3b, #ffc107); color: #333; }

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal.hidden { display: none; }

.modal-content {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    border: 2px solid #00d4ff;
    box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
    margin: 20px;
}

.modal-content h2 {
    font-size: 1.6rem;
    margin-bottom: 20px;
    color: #00d4ff;
}

.result-stats p {
    font-size: 1.1rem;
    margin: 8px 0;
    color: #ccc;
}

.highlight {
    color: #00d4ff;
    font-weight: bold;
}

.result-stats { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chess Vision Trainer</h1>
        <p class="subtitle">Find all legal moves as fast as you can!</p>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Time</span>
                <span id="timer" class="stat-value">0.00s</span>
            </div>
            <div class="stat">
                <span class="stat-label">Found</span>
                <span class="stat-value"><span id="moves-found">0</span>/<span id="total-moves">0</span></span>
            </div>
            <div class="stat">
                <span class="stat-label">Errors</span>
                <span id="mistakes" class="stat-value">0</span>
            </div>
        </div>

        <div class="board-wrapper">
            <div id="board" class="board"></div>
        </div>

        <div class="info-row">
            <div class="turn-indicator" id="turn-indicator">
                <span id="turn-text">White to move</span>
            </div>
            <div class="selection-box">
                <span id="from-square" class="square-display">-</span>
                <span class="arrow">→</span>
                <span id="to-square" class="square-display">-</span>
            </div>
        </div>

        <div class="found-moves">
            <h3>Found Moves:</h3>
            <div id="found-moves-list" class="moves-list"></div>
        </div>

        <div class="controls">
            <button id="start-btn" class="btn btn-primary">Start</button>
            <button id="new-position-btn" class="btn btn-secondary" disabled>New</button>
            <button id="hint-btn" class="btn btn-hint" disabled>Hint</button>
        </div>

        <div id="result-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Round Complete!</h2>
                <div class="result-stats">
                    <p>Time: <span id="final-time" class="highlight"></span></p>
                    <p>Moves: <span id="final-moves" class="highlight"></span></p>
                    <p>Errors: <span id="final-mistakes" class="highlight"></span></p>
                    <p>Score: <span id="final-score" class="highlight"></span></p>
                </div>
                <button id="play-again-btn" class="btn btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
class ChessVisionTrainer {
    constructor() {
        this.chess = null;
        this.boardElement = document.getElementById('board');
        this.timerElement = document.getElementById('timer');
        this.movesFoundElement = document.getElementById('moves-found');
        this.totalMovesElement = document.getElementById('total-moves');
        this.mistakesElement = document.getElementById('mistakes');
        this.foundMovesListElement = document.getElementById('found-moves-list');
        this.fromSquareElement = document.getElementById('from-square');
        this.toSquareElement = document.getElementById('to-square');
        this.turnTextElement = document.getElementById('turn-text');
        this.turnIndicator = document.getElementById('turn-indicator');
        this.startBtn = document.getElementById('start-btn');
        this.newPositionBtn = document.getElementById('new-position-btn');
        this.hintBtn = document.getElementById('hint-btn');
        this.resultModal = document.getElementById('result-modal');

        this.selectedSquare = null;
        this.legalMoves = [];
        this.foundMoves = new Set();
        this.mistakes = 0;
        this.timerInterval = null;
        this.startTime = null;
        this.isPlaying = false;

        this.pieces = {
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟',
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙'
        };

        this.setupEventListeners();
        this.initializeBoard();
    }

    setupEventListeners() {
        this.startBtn.addEventListener('click', () => this.startGame());
        this.newPositionBtn.addEventListener('click', () => this.newPosition());
        this.hintBtn.addEventListener('click', () => this.showHint());
        document.getElementById('play-again-btn').addEventListener('click', () => this.playAgain());
    }

    initializeBoard() {
        this.boardElement.innerHTML = '';
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const file = String.fromCharCode(97 + col);
                const rank = 8 - row;
                const squareName = file + rank;

                square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                square.dataset.square = squareName;
                square.addEventListener('click', () => this.handleSquareClick(squareName));

                this.boardElement.appendChild(square);
            }
        }
    }

    renderBoard() {
        const board = this.chess.board();
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const file = String.fromCharCode(97 + col);
                const rank = 8 - row;
                const squareName = file + rank;
                const squareElement = this.boardElement.querySelector(`[data-square="${squareName}"]`);

                const piece = board[row][col];
                if (piece) {
                    const pieceSymbol = piece.color === 'w'
                        ? this.pieces[piece.type.toUpperCase()]
                        : this.pieces[piece.type];
                    squareElement.textContent = pieceSymbol;
                    squareElement.classList.add(piece.color === 'w' ? 'white-piece' : 'black-piece');
                    squareElement.classList.remove(piece.color === 'w' ? 'black-piece' : 'white-piece');
                } else {
                    squareElement.textContent = '';
                    squareElement.classList.remove('white-piece', 'black-piece');
                }
                squareElement.classList.remove('selected', 'hint', 'found');
            }
        }

        const turn = this.chess.turn();
        this.turnTextElement.textContent = turn === 'w' ? 'White to move' : 'Black to move';
        this.turnIndicator.className = `turn-indicator ${turn === 'w' ? 'white' : 'black'}`;
    }

    generateRandomPosition() {
        const positions = [
            'rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1',
            'rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR b KQkq - 0 1',
            'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2',
            'rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2',
            'r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3',
            'r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4',
            'r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4',
            'r1bqk2r/ppp2ppp/2n2n2/2bpp3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 0 5',
            'rnbq1rk1/ppp1bppp/4pn2/3p4/2PP4/2N2N2/PP2PPPP/R1BQKB1R w KQ - 2 5',
            'r1bq1rk1/pppnbppp/4pn2/3p4/2PP4/2NBPN2/PP3PPP/R1BQK2R w KQ - 2 7',
            'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4',
            'r1b1kbnr/pppp1ppp/2n5/4p3/2B1P2q/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4',
            'rnbqk2r/pppp1ppp/5n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4',
            'r1bqkbnr/ppp2ppp/2np4/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 4',
            'rnbqk2r/ppp2ppp/3bpn2/3p4/2PP4/2N2N2/PP2PPPP/R1BQKB1R w KQkq - 2 5',
            'r3k2r/ppp2ppp/2n2n2/3pp3/1bB1P1b1/2NP1N2/PPP2PPP/R3K2R w KQkq - 0 8',
            '2r2rk1/pp2bppp/2n1pn2/3p4/3P4/2NBPN2/PP3PPP/2R2RK1 w - - 0 12',
            'r4rk1/1pp2ppp/p1n1pn2/3p4/1bPP4/2NBPN2/PP3PPP/R3K2R w KQ - 0 10',
            '3r1rk1/ppp2ppp/2n2n2/3pp3/8/2NP1N2/PPP2PPP/R3K2R w KQ - 0 10',
            'r2qkb1r/ppp1pppp/2n2n2/3p4/3P1Bb1/2N2N2/PPP1PPPP/R2QKB1R w KQkq - 4 5',
            'r1bqk2r/ppp2ppp/2n2n2/3pp3/1bP5/2N2NP1/PP1PPP1P/R1BQKB1R w KQkq - 0 5',
            'r1bq1rk1/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQ1RK1 w - - 0 7',
            'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
        ];
        return positions[Math.floor(Math.random() * positions.length)];
    }

    startGame() {
        this.chess = new Chess(this.generateRandomPosition());
        this.legalMoves = this.chess.moves({ verbose: true });
        this.foundMoves = new Set();
        this.mistakes = 0;
        this.selectedSquare = null;
        this.isPlaying = true;

        this.renderBoard();
        this.updateStats();
        this.resetSelection();

        this.startBtn.disabled = true;
        this.newPositionBtn.disabled = false;
        this.hintBtn.disabled = false;

        this.startTime = Date.now();
        this.timerInterval = setInterval(() => this.updateTimer(), 10);
    }

    newPosition() {
        if (this.timerInterval) clearInterval(this.timerInterval);
        this.foundMovesListElement.innerHTML = '';
        this.startGame();
    }

    handleSquareClick(squareName) {
        if (!this.isPlaying) return;

        const squareElement = this.boardElement.querySelector(`[data-square="${squareName}"]`);

        if (this.selectedSquare === null) {
            const piece = this.chess.get(squareName);
            const turn = this.chess.turn();

            if (piece && piece.color === turn) {
                const pieceMoves = this.legalMoves.filter(m => m.from === squareName);
                if (pieceMoves.length > 0) {
                    this.selectedSquare = squareName;
                    this.fromSquareElement.textContent = squareName;
                    squareElement.classList.add('selected');
                }
            }
        } else {
            if (squareName === this.selectedSquare) {
                this.resetSelection();
                return;
            }

            this.toSquareElement.textContent = squareName;

            const moveKey = this.selectedSquare + '-' + squareName;
            const move = this.legalMoves.find(m => m.from === this.selectedSquare && m.to === squareName);

            if (move && !this.foundMoves.has(moveKey)) {
                this.foundMoves.add(moveKey);
                this.addFoundMove(move);
                this.flashSquare(squareName, 'correct');
                this.updateFoundSquares();

                if (this.foundMoves.size === this.legalMoves.length) {
                    this.gameComplete();
                }
            } else if (this.foundMoves.has(moveKey)) {
                this.flashSquare(squareName, 'wrong');
            } else {
                this.mistakes++;
                this.mistakesElement.textContent = this.mistakes;
                this.flashSquare(squareName, 'wrong');
            }

            this.updateStats();
            this.resetSelection();
        }
    }

    flashSquare(squareName, type) {
        const squareElement = this.boardElement.querySelector(`[data-square="${squareName}"]`);
        squareElement.classList.add(type === 'correct' ? 'correct-flash' : 'wrong-flash');
        setTimeout(() => {
            squareElement.classList.remove('correct-flash', 'wrong-flash');
        }, 300);
    }

    resetSelection() {
        if (this.selectedSquare) {
            const prevSquare = this.boardElement.querySelector(`[data-square="${this.selectedSquare}"]`);
            prevSquare.classList.remove('selected');
        }
        this.selectedSquare = null;
        this.fromSquareElement.textContent = '-';
        this.toSquareElement.textContent = '-';
    }

    updateFoundSquares() {
        document.querySelectorAll('.square.found').forEach(sq => sq.classList.remove('found'));
        this.foundMoves.forEach(moveKey => {
            const [from, to] = moveKey.split('-');
            this.boardElement.querySelector(`[data-square="${to}"]`).classList.add('found');
        });
    }

    addFoundMove(move) {
        const moveTag = document.createElement('span');
        moveTag.className = 'move-tag';
        moveTag.textContent = move.san;
        this.foundMovesListElement.appendChild(moveTag);
    }

    updateStats() {
        this.movesFoundElement.textContent = this.foundMoves.size;
        this.totalMovesElement.textContent = this.legalMoves.length;
    }

    updateTimer() {
        const elapsed = (Date.now() - this.startTime) / 1000;
        this.timerElement.textContent = elapsed.toFixed(2) + 's';
    }

    showHint() {
        if (!this.isPlaying) return;

        for (const move of this.legalMoves) {
            const moveKey = move.from + '-' + move.to;
            if (!this.foundMoves.has(moveKey)) {
                const fromSquare = this.boardElement.querySelector(`[data-square="${move.from}"]`);
                fromSquare.classList.add('hint');
                setTimeout(() => { fromSquare.classList.remove('hint'); }, 1000);
                this.mistakes += 0.5;
                this.mistakesElement.textContent = this.mistakes;
                break;
            }
        }
    }

    gameComplete() {
        this.isPlaying = false;
        clearInterval(this.timerInterval);

        const finalTime = ((Date.now() - this.startTime) / 1000).toFixed(2);
        const score = Math.max(0, Math.round(1000 - (parseFloat(finalTime) * 10) - (this.mistakes * 50)));

        document.getElementById('final-time').textContent = finalTime + 's';
        document.getElementById('final-moves').textContent = this.foundMoves.size + '/' + this.legalMoves.length;
        document.getElementById('final-mistakes').textContent = this.mistakes;
        document.getElementById('final-score').textContent = score + ' pts';

        this.resultModal.classList.remove('hidden');
    }

    playAgain() {
        this.resultModal.classList.add('hidden');
        this.foundMovesListElement.innerHTML = '';
        this.startGame();
    }
}

document.addEventListener('DOMContentLoaded', () => { new ChessVisionTrainer(); });
    </script>
</body>
</html>
