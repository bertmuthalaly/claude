<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>IRC</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a2e;
      --bg2: #16213e;
      --fg: #e8e8e8;
      --dim: #888;
      --accent: #4a9eff;
      --border: #333;
    }
    html, body {
      height: 100%;
      font: 14px/1.4 ui-monospace, monospace;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }
    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f44;
    }
    #status.connected { background: #4f4; }
    #status.connecting { background: #ff4; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    #channel {
      flex: 1;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header button {
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    /* Sidebar */
    #sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      transition: left 0.2s;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    #sidebar.open { left: 0; }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      display: none;
    }
    #overlay.show { display: block; }
    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #channels {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .channel-item {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .channel-item:hover, .channel-item.active { background: var(--bg); }
    .channel-item .unread {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
    }
    /* Connection form */
    #connect-form {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    #connect-form input {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 4px;
      font: inherit;
    }
    #connect-form button {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }
    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      overscroll-behavior: contain;
    }
    .msg {
      padding: 2px 0;
      word-wrap: break-word;
    }
    .msg .time {
      color: var(--dim);
      font-size: 12px;
    }
    .msg .nick {
      color: var(--accent);
      font-weight: bold;
    }
    .msg.system { color: var(--dim); font-style: italic; }
    .msg.action { color: #c9a; }
    /* Input */
    #input-area {
      display: flex;
      padding: 8px 12px;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 4px;
      font: inherit;
      resize: none;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      padding: 10px 16px;
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
    }
    /* Desktop */
    @media (min-width: 768px) {
      #app { flex-direction: row; }
      #sidebar {
        position: relative;
        left: 0;
        width: 220px;
        flex-shrink: 0;
      }
      #overlay { display: none !important; }
      #menu-btn { display: none; }
      main { flex: 1; display: flex; flex-direction: column; }
      header { display: none; }
      #channel-desktop {
        display: block;
        padding: 12px;
        font-weight: bold;
        border-bottom: 1px solid var(--border);
      }
    }
    @media (max-width: 767px) {
      #channel-desktop { display: none; }
    }
    /* Bandwidth indicator */
    #bandwidth {
      font-size: 10px;
      color: var(--dim);
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="overlay"></div>
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Channels</span>
        <span id="bandwidth"></span>
      </div>
      <div id="channels"></div>
      <form id="connect-form">
        <input type="text" id="server" placeholder="Server (host:port)" value="irc.libera.chat:6697">
        <input type="text" id="nick" placeholder="Nickname">
        <input type="text" id="join-channel" placeholder="Channel (#example)">
        <button type="submit">Connect</button>
      </form>
    </aside>
    <main>
      <header>
        <button id="menu-btn">☰</button>
        <span id="status"></span>
        <span id="channel">Not connected</span>
      </header>
      <div id="channel-desktop">Not connected</div>
      <div id="messages"></div>
      <div id="input-area">
        <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
        <button id="send">Send</button>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/datascript@1.6.5/dist/datascript.min.js"></script>
  <script src="state.js"></script>
  <script src="network.js"></script>
  <script src="irc.js"></script>
  <script src="app.js"></script>
</body>
</html>
